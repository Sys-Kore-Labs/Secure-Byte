<!DOCTYPE html>
<html>
<head>
    <title>Hex Key Generator</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background: #d8d8d8;
        }

        body.dark {
            background: #101010;
            color: white;
        }

        .box {
            max-width: 460px;
            margin: auto;
            padding: 25px;
            background: white;
            border: 2px solid #222;
            border-radius: 12px;
        }

        body.dark .box {
            background: #1a1a1a;
            border-color: #444;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
        }

        textarea {
            height: 80px;
            resize: none;
            word-break: break-all;
            font-family: Consola, monospace;
        }

        button {
            border: none;
            background: #202020;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .small {
            color: gray;
            font-size: 13px;
        }

        #history {
            margin-top: 10px;
            padding: 10px;
            background: #eeeeee;
            font-family: Consolas, monospace;
            font-size: 12px;
            max-height: 130px;
            overflow-y: auto;
        }

        body.dark #history,
        body.dark textarea {
            background: #111;
            color: #00ff99;
            border: 1px solid #333;
        }

        .pop {
            animation: pop 0.2s;
        }

        @keyframes pop {
            50% {
                transform: scale(1.02);
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Hex Key Generator</h2>

        <label>Bytes</label>
        <input id="bytesInput" type="number" value="16" min="1" max="500">

        <label>Output format</label>
        <select id="formatInput">
            <option value="hex">Hex</option>
            <option value="spaced">Hex spaced</option>
            <option value="base64">Base64</option>
        </select>

        <button id="generateBtn">Generate</button>
        <button id="autoBtn">Auto regenerate: OFF</button>

        <textarea id="result" readonly></textarea>

        <p id="entropy" class="small">Entropy: 128 bits</p>

        <button id="copyBtn">Copy</button>
        <button id="saveBtn">Export .txt</button>
        <button id="themeBtn">Grey man mode</button>

        <h4>History</h4>
        <div id="history">No keys yet</div>
    </div>

    <script>
        // Simple project for making random hex keys.
        // I used crypto instead of Math.random because this is supposed to be saffer.

        var autoRunning = false;
        var autoTimer = null;
        var lastKey = "";

        var bytesInput = document.getElementById("bytesInput");
        var formatInput = document.getElementById("formatInput");
        var result = document.getElementById("result");
        var entropy = document.getElementById("entropy");
        var historyBox = document.getElementById("history");

        document.getElementById("generateBtn").onclick = generateKey;
        document.getElementById("copyBtn").onclick = copyKey;
        document.getElementById("saveBtn").onclick = savekey;
        document.getElementById("themeBtn").onclick = changeTheme;
        document.getElementById("autoBtn").onclick = chagenTheme;
        document.getElementById("autoBtn").onclick = toggleAuto;

        function generateKey() {
            var bytes = parseInt(bytesInput.value);

            if (isNaN(bytes) || bytes < 1) {
                bytes = 16;
                bytesInput.value = 16;
            }

            if (bytes > 500) {
                bytes = 500;
                bytesInput.value = 500;
                alert("I limited it to 500 bytes so it does not get ridiculous.");
            }

            var data = new Uint8Array(bytes);
            crypto.getRandomValues(data);

            var format = formatInput.value;
            var key = "";
            
            if (format == "base64") {
                key = bytesToBase64(data);
            } else {
                key = bytesToHex(data, format == "spaced")
            }
            lastKey = key;
            result.value = key;
            entropy.innerText = "Entropy: about " + (bytes * 8) + " bits";

            addToHistory(key);
            animateResult();
        }
        
        function bytesToHex(data, spaced) {
            var text = "";

            for (var i = 0; i < data.length; i++) {
                var hex = data [i].toString(16);

                // I knowm padStart exixts, but this is easier to understand.
                if (hex.length == 1) {
                    hex = "0" + hex;
                }

                text += hex;

                if (spaced) {
                    text += " ";
                }
            }
            return text.trim();
        }

        function bytesToBase64(data) {
            var text = "";

            for (var i = 0; i < data.length; i++) {
                text += String.fromCharCode(data[i]);
            }

            return btoa(text);
        }

        function addToHistory(key) {
            if (historyBox.innerText == "No keys Yet") {
                historyBox.innerHTML = "";
            }

            var shortKey =key;

            if (shortKey.length > 70) {
                shortKey = shortKey.substring(0,70) + "...";
            }

            historyBox.innerHTML = "<div>&gt; " + shortKey + "</div>" + historyBox.innerHTML;
        }

        function animateResult() {
            result.classList.remove("pop");
            void result.offsetWidth;
            result.classList.add("pop");
        }

        function copyKey() {
            result.select();
            document.execCommand("copy");
            alert("Copied..");
        }

        function saveKey() {
            if (lastKey == "") {
                alert("Generate a key first.");
                return;
            }

            var text = "Generated key:\n\n" + lastKey;
            var blob = new Blob([text], { type: "text/plain" });

            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "generate-key.txt";
        }

        function changeTheme() {
            document.body.classList.toggle("dark");
        }

        function toggleAuto() {
            var button = document.getElementById("autoBtn");

            if (autoRunning) {
                autoRunning = false;
                clearInterval(autoTimer);
                button.innerText = "Auto regenerate off";
            } else {
                autoRunning = true;
                autoTimer = setInterval(generateKey, 2000);
                button.innerText = "Auto regenerate: ON";
            }
        }
    </script>

</body>
</html>
